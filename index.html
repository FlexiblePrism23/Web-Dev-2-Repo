<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="main.js" defer></script>
</head>
<body class="bg-slate-100 min-h-screen">
    <header class="bg-white border-b border-slate-200">
        <div class="max-w-8xl mx-auto px-6 py-4 flex items-center justify-between">

            <h1 class="text-lg font-bold text-slate-900">Unit Converter</h1>


        </div>
    </header>
<section class="max-w-5xl mx-auto px-6 pt-12 pb-8 text-center">
    <h2 class="text-3xl sm:text-4xl font-bold text-slate-900">
    Convert anything, instantly
    </h2>

    <p class="text-base text-slate-600 mt-3 max-w-xl mx-auto">
    Three small tools for the units you actually run into: weight, distance and volume.
    </p>
</section>
<main class="max-w-4xl mx-auto px-6 pb-16">


        <!-- the three cards go in here -->
        <div class="bg-white rounded-2xl shadow-md p-6">
            <h3 class="text-2xl font-bold text-slate-900">Weight</h3>
            <p class="text-base text-slate-500 mt-2">Kilograms to pounds</p>
            <label for="kg-input" class="block text-base font-medium text-slate-700 mt-5 mb-2">
            Kilograms
            </label>
            <input
                id="kg-input"
                type="number"
                value="0"
                class="w-full rounded-lg border border-slate-300 px-4 py-2 text-slate-900
                focus:border-blue-500 focus:outline-none"/>
            <button
                id="kg-button"
                class="w-full mt-4 rounded-lg bg-blue-600 px-4 py-2 font-semibold text-white
                hover:bg-blue-700 transition cursor-pointer">
            Convert
            </button>
            <div class="mt-5 rounded-lg bg-slate-50 p-4 text-center">
            <p class="text-xs uppercase tracking-wide text-slate-500">Pounds</p>
            <p id="kg-result" class="text-2xl font-bold text-blue-600 mt-1">0.00</p>
            </div>
            </div>


    

</main>

<footer class="bg-white border-t border-slate-200 my-20">
<div class="max-w-5xl text-blue-600 mx-auto px-6 py-6 text-center ">
    Authors: Sebastian, Noah, Munachi

</div>
</footer>
<script src="script.js"></script>
</body>
</html>
